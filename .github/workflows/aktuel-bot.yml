name: Aktüel bot

on:
  schedule:
    # Türkiye saatiyle 07:17, 10:17, 13:17, 16:17, 19:17, 22:17 (UTC+3)
    - cron: "17 4,7,10,13,16,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece görsel üret, paylaşma"
        type: boolean
        default: true

permissions:
  contents: write  # state/posted.json'u repoya geri yazmak için

concurrency:
  group: aktuel-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aktuel-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aktuel-bot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Üretilen görselleri sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aktuel-gorseller-${{ github.run_id }}
          path: aktuel-bot/out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Paylaşım kaydını commit'le
        run: |
          git config user.name "aktuel-bot"
          git config user.email "aktuel-bot@users.noreply.github.com"
          git add state/posted.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "aktuel-bot: paylaşım kaydı güncellendi"
          git push
