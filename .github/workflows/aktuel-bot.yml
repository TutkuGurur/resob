name: Aktüel bot

on:
  schedule:
    # Her saat (dakika 7). Bot zamanı gelmiş ve bugün yapılmamış işleri kendisi seçer (--auto):
    # 09:00+ fiyat karşılaştırması, 12:00+ ve 20:00+ radar, 07-23 arası broşür taraması.
    # GitHub bir turu atlarsa bir sonraki saatte telafi edilir.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Ne yapılsın?"
        type: choice
        default: deneme
        options:
          - deneme      # sadece görsel üret, paylaşma/gönderme
          - baglanti    # Instagram/Cloudinary/Telegram bağlantısını test et
          - paylas      # Instagram'da paylaş ya da (Instagram yoksa) Telegram'a gönder
          - karsilastirma  # günlük 5 ürün fiyat karşılaştırmasını şimdi yap
          - reels          # bugünkü karşılaştırmanın sadece Reels videosunu paylaş
          - radar          # pazaryeri radarını şimdi çalıştır
          - otomatik       # zamanı gelmiş tüm işleri yap (saatlik çalıştırmanın aynısı)

permissions:
  contents: write  # state/posted.json'u repoya geri yazmak için

concurrency:
  group: aktuel-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aktuel-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aktuel-bot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          X_HANDLE: ${{ vars.X_HANDLE }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$MODE" = "otomatik" ]; then
            python main.py --auto
          elif [ "$MODE" = "radar" ]; then
            python main.py --radar
          elif [ "$MODE" = "karsilastirma" ]; then
            python main.py --compare
          elif [ "$MODE" = "reels" ]; then
            python main.py --reel-only
          elif [ "$MODE" = "deneme" ]; then
            python main.py --dry-run
          elif [ "$MODE" = "baglanti" ]; then
            python main.py --check
          else
            python main.py
          fi

      - name: Üretilen görselleri sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aktuel-gorseller-${{ github.run_id }}
          path: aktuel-bot/out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Paylaşım kaydını commit'le
        run: |
          git config user.name "aktuel-bot"
          git config user.email "aktuel-bot@users.noreply.github.com"
          git add state/posted.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "aktuel-bot: paylaşım kaydı güncellendi"
          # Bu arada dala başka commit geldiyse önce onları al, sonra gönder (kayıt kaybolmasın).
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || git rebase --abort
            sleep $((i * 3))
          done
          exit 1
